<!doctype html>
<html lang="__LANG__">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoCAD · Self-study review</title>
<style>
:root{color-scheme:light dark;--accent:#bf0048;--text:#202020;--muted:#666;--bg:#fff;--panel:#f4f4f4}
@media(prefers-color-scheme:dark){:root{--accent:#ff76a7;--text:#eee;--muted:#bbb;--bg:#181818;--panel:#242424}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}
main{max-width:1500px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 8px}p{color:var(--muted);margin:8px 0 20px}
button,select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--muted);border-radius:5px;padding:8px}
button,a,select{min-height:42px}button,a{cursor:pointer}a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.toolbar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:16px 0}.toolbar select{flex:1;min-width:220px}
.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(280px,1fr);gap:20px}.screen{position:relative;background:#000;aspect-ratio:16/9}
video{display:block;width:100%;height:100%;background:#000}#caption{position:absolute;left:6%;right:6%;bottom:14%;pointer-events:none;text-align:center}
#caption span{background:#000d;color:white;box-decoration-break:clone;padding:3px 7px;font-size:clamp(14px,1.55vw,24px);line-height:1.7}
#transcript{max-height:70vh;overflow:auto;background:var(--panel);padding:10px;border-radius:6px}#transcript button{display:block;width:100%;text-align:left;border:0;background:transparent;line-height:1.5;padding:10px;margin:3px 0}
#transcript button[aria-current=true]{background:var(--bg);box-shadow:inset 4px 0 var(--accent)}time{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:10px}
details{margin-top:20px;padding:16px;background:var(--panel)}summary{cursor:pointer;font-weight:600}textarea{display:block;width:100%;min-height:100px;resize:vertical;margin:12px 0}
#saved{color:var(--muted);min-height:26px}.hint{font-size:14px}footer{margin-top:25px;color:var(--muted);font-size:13px}
@media(max-width:850px){main{padding:16px}.layout{grid-template-columns:1fr}#transcript{max-height:42vh}}
</style></head>
<body><main>
<h1 id="heading"></h1><p id="intro"></p>
<div class="toolbar"><label id="lesson-label" for="lesson"></label><select id="lesson"></select><a id="slides" target="_blank" rel="noopener"></a><a id="download"></a></div>
<div class="layout"><section><div class="screen"><video id="video" controls preload="metadata" playsinline></video><div id="caption" aria-hidden="true"><span></span></div></div>
<div class="toolbar"><label><input id="captions" type="checkbox" checked> <span id="captions-label"></span></label><span id="position"></span></div>
<details open><summary id="feedback-title"></summary><p id="feedback-hint" class="hint"></p>
<label id="kind-label" for="kind"></label> <select id="kind"></select>
<textarea id="feedback"></textarea><button id="save" type="button"></button> <button id="export" type="button"></button>
<div id="saved" role="status" aria-live="polite"></div></details></section>
<section><h2 id="script-title"></h2><div id="transcript" aria-labelledby="script-title"></div></section></div>
<footer id="footer"></footer>
</main><script id="review-data" type="application/json">__DATA__</script>
<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent),en=data.language==='en';
const $=id=>document.getElementById(id),video=$('video'),list=$('transcript');let current,active=-1;
const t=(ko,english)=>en?english:ko;
const clock=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
$('heading').textContent=t('AutoCAD 자습 강의 검수','AutoCAD self-study review');
$('intro').textContent=t('차시별 자습 슬라이드, 대본과 강사 복제 음성을 함께 검토하세요. 대본을 누르면 해당 부분으로 이동합니다.','Review each lesson’s self-study slides, script and cloned instructor narration. Click the script to seek.');
if(!data.complete)$('intro').textContent=t('제작 중인 일부 차시 미리보기입니다. 전체 완성본이 아닙니다.','Preview of completed sample lessons. The full edition is still in production.');
$('lesson-label').textContent=t('차시','Lesson');$('slides').textContent=t('이 부분의 슬라이드 열기','Open matching slide');$('download').textContent=t('MP4 다운로드','Download MP4');
$('captions-label').textContent=t('자막 표시','Show captions');$('script-title').textContent=t('영상 대본','Video script');
$('feedback-title').textContent=t('검수 의견 남기기','Review feedback');$('feedback-hint').textContent=t('현재 차시와 영상 시간이 함께 저장됩니다. 검수를 마치면 의견 파일을 내보내 전달하세요.','Feedback includes the current lesson and video time. Export the feedback file when finished.');
$('kind-label').textContent=t('종류','Category');$('feedback').placeholder=t('확인한 문제나 수정할 내용을 적어 주세요.','Describe what needs checking or changing.');$('feedback').setAttribute('aria-label',t('검수 의견','Review feedback'));
$('save').textContent=t('현재 시간에 의견 저장','Save at current time');$('export').textContent=t('의견 JSON 내보내기','Export feedback JSON');
for(const [value,ko,english] of [['voice','음성·발음','Voice / pronunciation'],['slide','슬라이드·도해','Slide / diagram'],['script','대본·자막','Script / captions'],['procedure','실습 절차','Practice procedure']]){const o=document.createElement('option');o.value=value;o.textContent=t(ko,english);$('kind').append(o);}
for(const l of data.lessons){const o=document.createElement('option');o.value=l.number;o.textContent=l.number+' · '+l.title+' ('+clock(l.duration)+')';$('lesson').append(o);}
const storageKey='autocad-selfstudy-feedback:'+data.reviewId;let feedback=[];
try{feedback=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(feedback))feedback=[];}catch{}
function saveStatus(){ $('saved').textContent=t('저장한 의견: ','Saved feedback: ')+feedback.length; }
function update(){
 let lo=0,hi=current.cues.length-1,found=-1;
 while(lo<=hi){const mid=(lo+hi)>>1;if(current.cues[mid].start<=video.currentTime){found=mid;lo=mid+1;}else hi=mid-1;}
 if(found!==active){if(active>=0)list.children[active].removeAttribute('aria-current');active=found;if(active>=0)list.children[active].setAttribute('aria-current','true');}
 const cue=found>=0?current.cues[found]:null,visible=cue&&video.currentTime<cue.end&&$('captions').checked;
 $('caption').hidden=!visible;$('caption').firstElementChild.textContent=visible?cue.text:'';
 $('position').textContent=clock(video.currentTime)+' / '+clock(current.duration);
 $('slides').href=current.slides+'#s'+(cue?cue.slide:1);
}
function choose(){
 video.pause();current=data.lessons.find(l=>l.number===Number($('lesson').value));active=-1;list.replaceChildren();
 video.src=current.video;$('download').href=current.video;$('download').download=current.video;
 current.cues.forEach(c=>{const b=document.createElement('button'),stamp=document.createElement('time');b.type='button';stamp.textContent=clock(c.start);b.append(stamp,document.createTextNode(c.text));b.onclick=()=>{video.currentTime=c.start+.01;update();};list.append(b);});
 update();
}
$('lesson').onchange=choose;video.addEventListener('timeupdate',update);$('captions').onchange=update;
$('save').onclick=()=>{const text=$('feedback').value.trim();if(!text)return;feedback.push({lesson:current.number,language:data.language,seconds:Math.round(video.currentTime*1000)/1000,category:$('kind').value,text});
 try{localStorage.setItem(storageKey,JSON.stringify(feedback));$('feedback').value='';saveStatus();}catch{$('saved').textContent=t('브라우저 저장이 제한되어 있습니다. 지금 의견 파일을 내보내세요.','Browser storage is unavailable. Export the feedback file now.');}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({reviewId:data.reviewId,language:data.language,feedback},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='AutoCAD_'+data.language.toUpperCase()+'_SELFSTUDY_FEEDBACK.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('footer').textContent=t('검수본 · 사람 청취 및 AutoCAD 실습 검수는 별도입니다. 의견은 자동 전송되지 않습니다.','Review edition · Human listening and AutoCAD practice validation are separate. Feedback is not sent automatically.');
saveStatus();choose();
})();
</script></body></html>
