        #root {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          overflow: hidden;
          color: #111111;
          font-family:
            "LG EI Text TTF Regular", "LG EI Text", "Malgun Gothic", sans-serif;
        }
        * {
          box-sizing: border-box;

        .clip {
          position: absolute;
          inset: 0;
          width: 100%;

          background: #ffffff;

          position: relative;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-bottom: 18px;
          border-bottom: 2px solid #a4a3a4;
        }
        .eyebrow {
          color: #c7004c;
          font-size: 26px;
          font-weight: 600;
          letter-spacing: 0.08em;
        }
        .lesson {
          color: #666666;
          font-size: 24px;
        }
        .main {
          position: relative;
          display: grid;
          grid-template-columns: 0.98fr 1.02fr;
          gap: 62px;
          height: 760px;
          padding-top: 52px;
        }
        .copy {
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        .kicker {
          color: #666666;
          font-size: 30px;

          margin: 18px 0 28px;

          color: #666666;
          font-size: 35px;
          line-height: 1.45;
        }

          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
        }
        .outcome div {
          min-height: 94px;
          padding: 18px;
          background: #f5f5f3;
          border: 2px solid #a4a3a4;
          font-size: 27px;
          font-weight: 600;
        }
        .outcome b {
          display: block;
          margin-bottom: 7px;
          color: #c7004c;
          font-size: 20px;
        }
        .sequence {
          display: grid;
          gap: 10px;
          align-content: center;
          padding-left: 46px;
          border-left: 4px solid #c7004c;
        }
        .step {
          display: grid;
          grid-template-columns: 72px 1fr auto;
          align-items: center;
          min-height: 94px;
          padding: 14px 18px;
          border-bottom: 2px solid #a4a3a4;
        }
        .step b {
          color: #c7004c;
          font-size: 27px;
        }
        .step strong {
          font-size: 31px;
        }
        .step span {
          color: #666666;
          font-size: 22px;
        }
        .result {
          margin-top: 18px;
          padding: 24px;
          border: 3px solid #c7004c;
        }
        .result strong {
          display: block;
          font-family:
            "LG EI Headline TTF Semibold", "LG EI Headline TTF Regular",
            "LG EI Headline", "Malgun Gothic", sans-serif;
          font-size: 39px;
        }

          margin-top: 6px;
          color: #666666;
          font-size: 24px;
