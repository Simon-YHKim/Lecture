name: Private materials guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up test Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Test guard behavior
        shell: pwsh
        run: ./scripts/test-private-materials-guard.ps1

      - name: Scan tracked files
        shell: pwsh
        run: ./scripts/check-private-materials.ps1 -Mode all

      - name: Validate AutoCAD course projects
        shell: pwsh
        run: ./scripts/check-course-projects.ps1

      - name: Test review feedback transfer
        run: node --test scripts/selfstudy/test_review_transfer.cjs

      - name: Test course preparation and self-study
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python -m unittest discover -s scripts/part -p 'test_*.py'
          python -m unittest discover -s scripts/selfstudy -p 'test_*.py'
